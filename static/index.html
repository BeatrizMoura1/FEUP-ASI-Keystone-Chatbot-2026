<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keystone</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-button menu-button" id="menu-button" title="Chats" aria-label="Show chats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a class="brand" href="/">
      <img class="logo" src="/static/logo.svg" alt="">
      <span class="brand-text">Keystone<small>Contoso knowledge assistant</small></span>
    </a>
    <a class="nav-link" id="admin-link" href="/admin" hidden>Admin</a>
    <div class="user-chip" id="user-chip" hidden>
      <span class="avatar" id="user-avatar"></span>
      <span id="user-name"></span>
      <span class="role" id="user-role"></span>
    </div>
    <button class="icon-button" id="logout-button" title="Log out" aria-label="Log out" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
    </button>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Chats">
      <button class="new-chat-button" id="new-chat-button" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        New chat
      </button>
      <div class="history" id="history"></div>
    </nav>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <main class="chat">
      <div class="thread-scroll" id="thread-scroll">
        <div class="thread" id="thread">
          <div class="welcome" id="welcome">
            <img class="logo" src="/static/logo.svg" alt="">
            <h2 id="welcome-title">Hi, I'm Keystone</h2>
            <p>Ask me about Contoso's policies, procedures and projects. I answer only from the documents you have access to, and show my sources.</p>
            <div class="suggestions" id="suggestions"></div>
          </div>
        </div>
      </div>
      <div class="composer-wrap">
        <form class="composer" id="ask-form">
          <textarea id="question-input" rows="1" placeholder="Ask a question…" aria-label="Your question"></textarea>
          <button class="send-button" id="ask-button" title="Send" aria-label="Send" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
          </button>
        </form>
        <p class="composer-hint">Enter to send · Shift + Enter for a new line</p>
      </div>
    </main>

    <aside class="drawer" id="drawer" aria-label="Source document">
      <div class="drawer-header">
        <div class="drawer-title">
          <h3 id="drawer-name"></h3>
          <span class="badge" id="drawer-project"></span>
        </div>
        <button class="icon-button" id="close-drawer" title="Close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="drawer-body"><pre id="drawer-content"></pre></div>
    </aside>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
